[project]
name = "forma-fitness-coach"
version = "0.1.0"
description = "Fitness coach and nutrition assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.17.0",
    "httpx==0.28.1",
    "nicegui==3.15.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
